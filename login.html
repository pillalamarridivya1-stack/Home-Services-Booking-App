<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Home Services Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Login Container -->
    <div class="form-container">

        <div class="form-card">

            <h2>Home Services Login</h2>

            <p>
                Login to book and manage your home services.
            </p>


            <!-- Login Form -->
            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >


                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <!-- Signup Link -->
            <p>

                Don't have an account?

                <a href="signup.html">
                    Signup
                </a>

            </p>


            <!-- Home Link -->
            <p>

                <a href="index.html">
                    ← Back to Home
                </a>

            </p>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="login.js"></script>

</body>

</html>
